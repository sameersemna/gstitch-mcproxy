name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor from `engines` (AbortSignal.any landed in 20.3); 22 and 24 are the
        # currently supported LTS lines.
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Assert zero runtime dependencies
        # The project's headline property. A dependency here is a feature regression, so it
        # fails the build rather than being noticed later.
        run: |
          if [ -n "$(npm ls --omit=dev --parseable --depth=0 2>/dev/null | tail -n +2)" ]; then
            echo "::error::Runtime dependencies were added. gstitch-mcproxy must stay zero-dependency."
            npm ls --omit=dev
            exit 1
          fi

      - name: Smoke test the entry point
        run: |
          node index.js &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8787/health | tee /dev/stderr | grep -q '"status":"ok"'
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID" || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gstitch-mcproxy:ci .
      - name: Container healthcheck
        run: |
          docker run -d --name proxy -p 8787:8787 gstitch-mcproxy:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8787/health
          docker stop proxy
          test "$(docker inspect -f '{{.State.Health.Status}}' proxy)" != "unhealthy"
